<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Thomaz Barrago</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ecebe7">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@100,900&family=Host+Grotesk:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    // Same theme as the rest of the site (assets/js/theme.js): the visitor's choice, or the system's.
    (() => {
      let t = null;
      try { t = localStorage.getItem('theme'); } catch {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#181817';
    })();
  </script>
  <style>
    /* Served by GitHub Pages at any missing path, so every link here is absolute. */
    .nf { min-height: 100svh; display: flex; flex-direction: column; padding: 0 var(--gutter); }
    .nf__body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 48px 0; }
    .nf__code { font-family: var(--font-display); font-weight: 900; font-size: clamp(120px, 28vw, 360px); line-height: .85; letter-spacing: -0.04em; margin: 0; }
    .nf__code i { font-style: normal; color: var(--accent); }
    .nf__text { max-width: 34ch; font-size: var(--step-body); margin: 0; }
    .nf__text + .nf__text { color: var(--muted); }
    .nf__actions { display: flex; flex-wrap: wrap; gap: 12px; }
  </style>
</head>
<body>
<main class="nf">
  <nav class="nav" aria-label="Principal">
    <a class="wordmark" href="/" aria-label="Thomaz Barrago, início">thomaz<i>.</i></a>
  </nav>
  <div class="nf__body">
    <h1 class="nf__code">404<i>.</i></h1>
    <p class="nf__text">Esta página não existe, ou mudou de sítio.</p>
    <p class="nf__text" lang="en">This page doesn't exist, or it has moved.</p>
    <div class="nf__actions">
      <a class="btn" href="/">Ir para o início <span class="arrow" aria-hidden="true">→</span></a>
      <a class="btn btn--ink" href="/en/" lang="en">Go to the home page <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </div>
</main>
</body>
</html>
